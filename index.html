      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [role, setRole] = useState('student');
      const [showNotifications, setShowNotifications] = useState(false);

      const [notifications, setNotifications] = useState([
        { id: 1, title: 'Visa Expiration Alert', text: 'Temporary registration ends in 12 days. Visit Room 214.', time: '10 min ago', unread: true },
        { id: 2, title: 'New Message from Mentor', text: 'Sanzhar: Salem! Let me know if you need help with the Kaspi card.', time: '1 hour ago', unread: true },
        { id: 3, title: 'Orientation Event', text: 'Astana City Bus Tour starts this Saturday at 14:00.', time: 'Yesterday', unread: false }
      ]);

      const [messages, setMessages] = useState([
        { sender: 'buddy', text: 'Salem! Welcome to Kazakhstan! I am your mentor. Ask me anything about visa, transport, or classes.', time: '10:00' }
      ]);
      const [inputText, setInputText] = useState('');

      const t = translations[lang];

      const studentsData = [
        { id: 'S101', name: 'Aarav Patel', country: 'India', major: 'General Medicine', gpa: 2.1, attendance: '68%', visaDays: 9, status: 'At Risk' },
        { id: 'S102', name: 'Dilnoza Karimova', country: 'Uzbekistan', major: 'IT & Software', gpa: 3.4, attendance: '92%', visaDays: 45, status: 'Good' },

        { id: 'S104', name: 'Mergen Amanov', country: 'Turkmenistan', major: 'Oil & Gas', gpa: 3.1, attendance: '88%', visaDays: 60, status: 'Good' },
      ];

      const unreadCount = notifications.filter(n => n.unread).length;

      const handleLogin = (e) => {
        e.preventDefault();
        if (loginEmail.trim() && loginPassword.trim()) {
          setIsAuthenticated(true);
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        setLoginEmail('');
        setLoginPassword('');
        setShowNotifications(false);
      };

      const markAllAsRead = () => {
        setNotifications(notifications.map(n => ({ ...n, unread: false })));
      };

      const handleSendMessage = () => {
        if (!inputText.trim()) return;
        const newMsg = { sender: 'student', text: inputText, time: 'Now' };
        setMessages((prev) => [...prev, newMsg]);
        setInputText('');
        setTimeout(() => {
          setMessages((prev) => [
            ...prev,
            { sender: 'buddy', text: lang === 'ru' ? 'Принято! Помогу с этим вопросом. Можем встретиться после пар.' : lang === 'kz' ? 'Жақсы! Бұл сұраққа көмектесемін. Сабақтан соң кездесейік.' : 'Got it! I can help you with that. Let me meet you after lectures.', time: 'Just now' }
          ]);
        }, 800);

                      <option value="mentor">{t.mentor}</option>
                      <option value="admin">{t.admin}</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">{t.email}</label>
                    <input
                      type="text"
                      required
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                      placeholder="student@aitu.edu.kz"
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-600"

                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">{t.password}</label>
                    <input
                      type="password"
                      required
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-indigo-600"
                    />
                  </div>

                  <p className="text-[11px] text-slate-400 italic text-center">{t.demoCreds}</p>

                  <button
                    type="submit"
                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg transition shadow-md"

                    {t.signInBtn}
                  </button>
                </form>
              </div>
            </div>
          ) : (
            /* Main Dashboard */
            <div className="flex-1 flex flex-col">
              {/* Main Header */}
              <header className="bg-indigo-900 text-white shadow-md relative">
                <div className="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-xl shadow">🇰🇿</div>
                    <div>
                      <h1 className="text-xl font-bold tracking-tight">{t.appTitle}</h1>
                      <p className="text-xs text-indigo-200">{t.appSubtitle}</p>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3">
                    {/* Role Switcher */}
                    <div className="flex items-center bg-indigo-800/90 p-1 rounded-xl border border-indigo-700 text-xs">
                      <span className="text-[11px] text-indigo-300 px-2 font-medium">{t.role}:</span>
                      <button onClick={() => setRole('student')} className={`px-2.5 py-1 rounded-lg font-semibold transition ${role === 'student' ? 'bg-white text-indigo-900 shadow' : 'text-indigo-200 hover:text-white'}`}>{t.student}</button>
                      <button onClick={() => setRole('mentor')} className={`px-2.5 py-1 rounded-lg font-semibold transition ${role === 'mentor' ? 'bg-white text-indigo-900 shadow' : 'text-indigo-200 hover:text-white'}`}>{t.mentor}</button>
                      <button onClick={() => setRole('admin')} className={`px-2.5 py-1 rounded-lg font-semibold transition ${role === 'admin' ? 'bg-white text-indigo-900 shadow' : 'text-indigo-200 hover:text-white'}`}>{t.admin}</button>
                    </div>

                    {/* Notification Bell Icon */}
                    <div className="relative">
                      <button
                        onClick={() => setShowNotifications(!showNotifications)}
                        className="p-2 rounded-xl bg-indigo-800 hover:bg-indigo-700 text-white relative transition"
                        title={t.notifications}
                      >
                        🔔
                        {unreadCount > 0 && (
                          <span className="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold border-2 border-indigo-900">
                            {unreadCount}
                          </span>
                        )}
                      </button>

                      {/* Notification Dropdown Window */}
                      {showNotifications && (
                        <div className="absolute right-0 mt-3 w-80 bg-white rounded-2xl shadow-2xl border border-slate-200 text-slate-800 z-50 overflow-hidden">
                          <div className="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                            <span className="text-xs font-bold text-slate-700">{t.notifications} ({unreadCount})</span>
                            {unreadCount > 0 && (
                              <button onClick={markAllAsRead} className="text-[11px] text-indigo-600 hover:underline font-medium">{t.markAllRead}</button>
                            )}
                          </div>
                          <div className="divide-y divide-slate-100 max-h-72 overflow-y-auto">
                            {notifications.length === 0 ? (
                              <div className="p-4 text-center text-xs text-slate-400">{t.noNotifications}</div>
                            ) : (
                              notifications.map((n) => (
                                <div key={n.id} className={`p-3 text-xs hover:bg-slate-50 transition flex items-start space-x-2.5 ${n.unread ? 'bg-indigo-50/50' : ''}`}>

                                    <div className="text-slate-400 text-[10px] mt-1">{n.time}</div>
                                  </div>
                                </div>
                              ))
                            )}
                          </div>
                        </div>

                    {/* Logout Button */}
                    <button

                      className="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-semibold transition"

                      {t.logout}

                  </div>
                </div>
              </header>

              {/* Main Content Area */}
              <main className="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
                {/* 1. Student View */}
                {role === 'student' && (
                  <div className="space-y-6">
                    <div className="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm flex items-start justify-between">
                      <div>
                        <h3 className="text-sm font-bold text-amber-900">{t.visaAlertTitle}</h3>
                        <p className="text-xs text-amber-700 mt-1">{t.visaAlertDesc}</p>
                      </div>
                      <span className="bg-amber-200 text-amber-900 text-xs px-2.5 py-1 rounded-full font-bold">{t.actionRequired}</span>
                    </div>

                    <div className="grid md:grid-cols-3 gap-6">
                      <div className="md:col-span-2 space-y-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                          <div className="flex justify-between items-center mb-4">
                            <h2 className="text-base font-bold text-slate-800">{t.mentorTitle}</h2>
                            <span className="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md font-semibold">{t.matched}</span>
                          </div>
                          <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                              <div className="w-12 h-12 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-lg">SA</div>
                              <div>
                                <h4 className="font-semibold text-slate-900">Sanzhar A.</h4>
                                <p className="text-xs text-slate-500">Cybersecurity • 3rd Year • EN / KZ / RU</p>
                              </div>
                            </div>
                            <span className="text-xs font-semibold bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg border border-indigo-200">{t.mentorRating}</span>
                          </div>

                          <div className="mt-4 border border-slate-200 rounded-xl overflow-hidden flex flex-col h-64 bg-slate-50">
                            <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 text-xs font-bold text-slate-600 flex justify-between">
                              <span>{t.chatTitle}</span>
                              <span className="text-emerald-600">{t.online}</span>
                            </div>
                            <div className="flex-1 p-3 overflow-y-auto space-y-2 text-sm">
                              {messages.map((m, idx) => (
                                <div key={idx} className={`flex ${m.sender === 'student' ? 'justify-end' : 'justify-start'}`}>
                                  <div className={`p-2.5 rounded-xl max-w-xs text-xs ${m.sender === 'student' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-white border text-slate-800 rounded-bl-none shadow-sm'}`}>
                                    {m.text}
                                  </div>
                                </div>
                              ))}
                            </div>
                            <div className="p-2 bg-white border-t border-slate-200 flex gap-2">
                              <input
                                type="text"
                                value={inputText}
                                onChange={(e) => setInputText(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                                placeholder={t.chatPlaceholder}
                                className="flex-1 px-3 py-1.5 border border-slate-300 rounded-lg text-xs outline-none focus:border-indigo-600"
                              />
                              <button onClick={handleSendMessage} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-4 py-1.5 rounded-lg font-medium">{t.send}</button>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="space-y-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                          <h3 className="font-bold text-slate-800 text-sm mb-3">{t.guideTitle}</h3>
                          <div className="space-y-3 text-xs">
                            <div className="p-2.5 rounded-lg bg-indigo-50/60 border border-indigo-100">
                              <div className="font-semibold text-indigo-900">{t.transport}</div>
                              <p className="text-slate-600 mt-0.5">{t.transportDesc}</p>
                            </div>
                            <div className="p-2.5 rounded-lg bg-emerald-50/60 border border-emerald-100">
                              <div className="font-semibold text-emerald-900">{t.groceries}</div>
                              <p className="text-slate-600 mt-0.5">{t.groceriesDesc}</p>
                            </div>
                            <div className="p-2.5 rounded-lg bg-amber-50/60 border border-amber-100">
                              <div className="font-semibold text-amber-900">{t.iin}</div>
                              <p className="text-slate-600 mt-0.5">{t.iinDesc}</p>
                            </div>
                          </div>
                        </div>

                        <div className="bg-gradient-to-br from-indigo-700 to-indigo-900 text-white p-5 rounded-2xl shadow-sm text-xs space-y-2">
                          <h4 className="font-bold text-sm">{t.hotlines}</h4>
                          <p>🚑 Medical: <strong>103</strong></p>
                          <p>🚓 Police: <strong>102</strong></p>
                          <p>🏢 University 24/7 Dean Help: <strong>+7 (7172) 645-710</strong></p>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. Senior Mentor View */}
                {role === 'mentor' && (
                  <div className="space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                      <h2 className="text-base font-bold text-slate-800 mb-4">{t.menteesTitle}</h2>
                      <div className="grid md:grid-cols-2 gap-4 text-xs">
                        <div className="p-4 border rounded-xl bg-slate-50 space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-800 text-sm">Aarav Patel (1st Year)</span>
                            <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold">Needs Help</span>
                          </div>
                          <p className="text-slate-600">Major: General Medicine • From: India</p>
                          <p className="text-slate-500">Note: Needs guidance finding Halal/Vegetarian groceries and opening Kaspi card.</p>
                          <button className="w-full mt-2 bg-indigo-600 text-white py-1.5 rounded-lg font-medium">{t.scheduleBtn}</button>
                        </div>
                        <div className="p-4 border rounded-xl bg-slate-50 space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-slate-800 text-sm">Li Wei (1st Year)</span>
                            <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">Adapted</span>
                          </div>
                          <p className="text-slate-600">Major: Cybersecurity • From: China</p>
                          <p className="text-slate-500">Note: Attended cultural city tour. Academic progress stable.</p>
                          <button className="w-full mt-2 bg-slate-200 text-slate-700 py-1.5 rounded-lg font-medium">{t.progressBtn}</button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 3. International Office View */}
                {role === 'admin' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500 font-medium">{t.totalForeign}</div>
                        <div className="text-2xl font-bold text-indigo-900 mt-1">35,000+</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">{t.statEvidence}</div>
                      </div>
                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500 font-medium">{t.expulsionsPrev}</div>
                        <div className="text-2xl font-bold text-emerald-600 mt-1">94.2%</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">{t.viaWarnings}</div>
                      </div>
                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500 font-medium">{t.visaExp}</div>
                        <div className="text-2xl font-bold text-rose-600 mt-1">14</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">{t.visaExpSub}</div>
                      </div>
                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <div className="text-xs text-slate-500 font-medium">{t.activeBuddies}</div>
                        <div className="text-2xl font-bold text-slate-800 mt-1">86</div>
                        <div className="text-[11px] text-slate-400 mt-0.5">{t.activeBuddiesSub}</div>
                      </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                      <div className="px-6 py-4 border-b border-slate-200">
                        <h3 className="font-bold text-slate-800 text-sm">{t.tableTitle}</h3>
                        <p className="text-xs text-slate-500">{t.tableDesc}</p>
                      </div>
                      <div className="overflow-x-auto">
                        <table className="w-full text-xs text-left">
                          <thead className="bg-slate-50 text-slate-500 uppercase font-semibold border-b">
                            <tr>
                              <th className="px-4 py-3">{t.colName}</th>
                              <th className="px-4 py-3">{t.colCountry}</th>
                              <th className="px-4 py-3">{t.colMajor}</th>
                              <th className="px-4 py-3">{t.colGPA}</th>
                              <th className="px-4 py-3">{t.colAttendance}</th>
                              <th className="px-4 py-3">{t.colVisa}</th>
                              <th className="px-4 py-3">{t.colRisk}</th>
                              <th className="px-4 py-3">{t.colAction}</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100">
                            {studentsData.map((s) => (
                              <tr key={s.id} className="hover:bg-slate-50">
                                <td className="px-4 py-3 font-semibold text-slate-900">{s.name}</td>
                                <td className="px-4 py-3">{s.country}</td>
                                <td className="px-4 py-3">{s.major}</td>
                                <td className="px-4 py-3 font-medium">{s.gpa}</td>
                                <td className="px-4 py-3">{s.attendance}</td>
                                <td className="px-4 py-3">
                                  <span className={`px-2 py-0.5 rounded font-bold ${s.visaDays < 15 ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-700'}`}>
                                    {s.visaDays} {t.daysLeft}
                                  </span>
                                </td>
                                <td className="px-4 py-3">
                                  <span className={`px-2 py-0.5 rounded-full font-bold text-[10px] ${s.status === 'At Risk' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                    {s.status}
                                  </span>
                                </td>
                                <td className="px-4 py-3">
                                  <button className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-2.5 py-1 rounded">{t.alertMentorBtn}</button>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
                {t.footer}
              </footer>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
